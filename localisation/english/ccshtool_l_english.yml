 ccshtool_tag_switch_button_tt:0 "Switch the player on the §YTarget§! to the §YReceiver§!. If the §YTarget§! has access to the §YHost Tool§!, this will be transferred."
 ccshtool_white_peace_button_tt:0 "This button has multiple modes:\n\nIf only the §YTarget§! has been locked and they're at war, clicking this will force a White Peace between the §YTarget§! and all enemies.\n\nIf the §YReceiver§! is also locked and they're at war with the the §YTarget§!, clicking this will force a White Peace with the §YReceiver§! only."
