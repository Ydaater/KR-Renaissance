### Buttons

# Main
 ccshtool_toggle_visibility_button_tt:0 "[CCSHTOOL_OPEN_CLOSE_SCRIPTLOC]"
 ccshtool_toggle_visibility_on:0 "Click to open the §YHost Tool§!."
 ccshtool_toggle_visibility_off:0 "Click to close the §YHost Tool§!. This also clears any locked §YTarget§! and/or §YReceiver§!, and any marked states."
 ccshtool_in_use_button_tt:0 "A §YTarget§! and/or §YReceiver§! is locked by a Host right now. Wait until they are done - only one action can be done at a time."
 ccshtool_close_button_tt:0 "Close the §YHost Tool§!. This also releases any locked §YTarget§! and §YReceiver§!, and unmarks every state."
 ccshtool_info_button_tt:0 "§YUsing the Host Tool§!\n----------------------------------------------------------------\n\n§RThe §YHost Tool§R is powerful and should be used with care. Incorrect usage can break a save game.§!\n\n§YTarget§! is the country an action is done §Ito§!. §YReceiver§! is the country that §Ibenefits§! from it. Marked states, for example, are transferred §Yfrom§! the Target §Yto§! the Receiver.\n\n§YPicking the two countries§!\nClick a state on the map, then press the lock button on the right of the Target or Receiver line. The lock closes to show the choice is held. Press it again to release.\n\n§YThe tabs§!\n§YStates§! - mark states, then transfer, core, claim or set compliance on everything marked.\n§YPolitics§! - ruling party, party popularity and the leader's sub-ideology.\n§YBuildings§! - pick a building, then a step, to build or remove it on the marked states. Marking is available here too, and it is the same list as in the States tab.\n§YNation§! - stability, war support, political power, manpower, command power, experience and research.\n§YDiplomacy§! - autonomy, war, peace, factions, and granting the tool to another player.\n\n§YSharing the tool§!\nWhile a Target or Receiver is locked, every Host sees the §RIN USE§! badge in this title bar. Only one action can be done at a time, so take turns.\n\n§YClick this button to clear the locked Target and Receiver and unmark every state.§!"
 ccshtool_switch_button_tt:0 "Swap the §YTarget§! and the §YReceiver§!."
 ccshtool_add_host_button_tt:0 "Click to give the §YTarget§! access to the §YHost Tool§!."
 ccshtool_remove_host_button_tt:0 "Click to remove the §YTarget§!'s access to the §YHost Tool§!."

# Target / Receiver
 ccshtool_target_toggle_on_button_tt:0 "Click to unlock the selected §YTarget§!."
 ccshtool_target_toggle_off_button_tt:0 "Click to lock the selected §YTarget§!, which is determined by the owner of the currently selected state. This cannot be the same country as the §YReceiver§!."
 ccshtool_receiver_toggle_on_button_tt:0 "Click to unlock the selected §YReceiver§!."
 ccshtool_receiver_toggle_off_button_tt:0 "Click to lock the selected §YReceiver§!, which is determined by the owner of the currently selected state. This cannot be the same country as the §YTarget§!."

