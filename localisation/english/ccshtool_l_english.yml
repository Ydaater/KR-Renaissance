 ccshtool_declare_war_button_tt:0 "Force the §YTarget§! to declare war on the §YReceiver§!. This button is disabled if they are allied."
 ccshtool_join_faction_button_tt:0 "This button has multiple modes:\n\nIf the §YTarget§! is in a faction, clicking this will make them the faction leader.\n\nIf the §YTarget§! is not in a faction, clicking this will force it to join the faction of the §YReceiver§!.\n\nIf neither are in a faction, a new faction will be created with the §YReceiver§! as the leader."
