 ccshtool_leave_faction_button_tt:0 "This button has multiple modes:\n\nIf the §YTarget§! is the faction leader, clicking this will disband the faction.\n\nIf the §YTarget§! is a member of a faction, clicking this will force them to leave the faction."
 ccshtool_refresh_focus_button_tt:0 "Refresh the checks within the §YTarget§!'s focus tree. This does not reset any progress."

