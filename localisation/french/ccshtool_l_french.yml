 ccshtool_unmark_all_states_button_tt:0 "Démarquer tous les États appartenant à la §YCible§!.\n\n§Y[?global.ccshtool_states_marked^num]§! État(s) marqué(s)."
 ccshtool_transfer_states_button_tt:0 "Transférer §Y[?global.ccshtool_states_marked^num]§! État(s) de la §YCible§! au §YDestinataire§!. Indisponible si tous les États possédés sont marqués : utilisez l'annexion."
 ccshtool_set_compliance_button_tt:0 "Porter §Y[?global.ccshtool_states_marked^num]§! État(s) appartenant à la §YCible§! à au moins 60 % de accommodement."
 ccshtool_core_button_tt:0 "Rendre §Y[?global.ccshtool_states_marked^num]§! État(s) appartenant à la §YCible§! territoires nationaux."
