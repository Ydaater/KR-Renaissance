### Buttons

# Main
 ccshtool_toggle_visibility_button_tt:0 "[CCSHTOOL_OPEN_CLOSE_SCRIPTLOC]"
 ccshtool_toggle_visibility_on:0 "Cliquez pour ouvrir le §YHost Tool§!."
 ccshtool_toggle_visibility_off:0 "Cliquez pour fermer le §YHost Tool§!. Réinitialise aussi la §YCible§! et le §YDestinataire§! verrouillés, ainsi que les États marqués."
 ccshtool_in_use_button_tt:0 "Une §YCible§! et/ou un §YDestinataire§! est verrouillé par un hôte. Attendez qu'il ait fini - une seule action à la fois."
 ccshtool_close_button_tt:0 "Fermer le §YHost Tool§!. Libère aussi la §YCible§! et le §YDestinataire§! verrouillés, et démarque tous les États."
 ccshtool_info_button_tt:0 "§YUtiliser le Host Tool§!\n----------------------------------------------------------------\n\n§RLe §YHost Tool§R est puissant et doit être utilisé avec précaution. Un mauvais usage peut corrompre une sauvegarde.§!\n\n§YCible§! est le pays §Isubissant§! l'action. §YDestinataire§! est le pays qui en §Ibénéficie§!. Les États marqués, par exemple, sont transférés §Ydu§! Cible §Yvers le§! Destinataire.\n\n§YChoisir les deux pays§!\nCliquez sur un État de la carte, puis sur le cadenas à droite de la ligne Cible ou Destinataire. Le cadenas se ferme quand le choix est retenu. Cliquez de nouveau pour le libérer.\n\n§YLes onglets§!\n§YÉtats§! - marquez des États, puis transférez, donnez un territoire national, revendiquez ou réglez l'accommodement sur tout ce qui est marqué.\n§YPolitique§! - parti au pouvoir, popularité des partis et sous-idéologie du dirigeant.\n§YBâtiments§! - choisissez un bâtiment, puis un pas, pour le construire ou le retirer sur les États marqués. Le marquage est aussi disponible ici, et c'est la même liste que dans l'onglet États.\n§YNation§! - stabilité, soutien à la guerre, poids politique, réserves, puissance de commandement, expérience et recherche.\n§YDiplomatie§! - autonomie, guerre, paix, factions, et attribution de l'outil à un autre joueur.\n\n§YPartager l'outil§!\nTant qu'une Cible ou un Destinataire est verrouillé, tous les hôtes voient le badge §REN COURS§! dans cette barre de titre. Une seule action à la fois : jouez chacun votre tour.\n\n§YCliquez sur ce bouton pour libérer la Cible et le Destinataire verrouillés et démarquer tous les États.§!"
 ccshtool_switch_button_tt:0 "Intervertir la §YCible§! et le §YDestinataire§!."
 ccshtool_add_host_button_tt:0 "Cliquez pour donner à la §YCible§! l'accès au §YHost Tool§!."
 ccshtool_remove_host_button_tt:0 "Cliquez pour retirer à la §YCible§! l'accès au §YHost Tool§!."

# Target / Receiver
 ccshtool_target_toggle_on_button_tt:0 "Cliquez pour déverrouiller la §YCible§! sélectionnée."
 ccshtool_target_toggle_off_button_tt:0 "Cliquez pour verrouiller la §YCible§! sélectionnée, déterminée par le propriétaire de l'État sélectionné. Ne peut pas être le même pays que le §YDestinataire§!."
 ccshtool_receiver_toggle_on_button_tt:0 "Cliquez pour déverrouiller le §YDestinataire§! sélectionné."
 ccshtool_receiver_toggle_off_button_tt:0 "Cliquez pour verrouiller le §YDestinataire§! sélectionné, déterminé par le propriétaire de l'État sélectionné. Ne peut pas être le même pays que la §YCible§!."

